[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailguide"
version = "0.1.0"
description = "Data-first SEO/AEO/GEO opportunity analysis and revenue-targeted prioritization engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
trailguide = "trailguide.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["out"]

[tool.ruff.lint]
# Ruff's defaults: pycodestyle errors and pyflakes. The codebase is kept clean
# against these, so `ruff check` passing is a meaningful signal.
select = ["E4", "E7", "E9", "F"]
